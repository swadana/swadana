<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel & Food Order Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="ph ph-fork-knife text-3xl bg-indigo-700 p-2 rounded-xl"></i>
                <div>
                    <h1 class="text-xl font-bold">Hotel & Food Order Hub</h1>
                    <p class="text-indigo-200 text-xs">Direct SheetSync Active</p>
                </div>
            </div>
            <button onclick="fetchOrders()" class="bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm font-medium">
                <i class="ph ph-arrows-clockwise"></i> Refresh
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-1 h-fit">
            <h2 class="text-lg font-bold mb-4">Log New Order</h2>
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Customer Name *</label>
                    <input type="text" id="customerName" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number *</label>
                    <input type="tel" id="phoneNumber" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Order Source</label>
                    <select id="orderSource" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                        <option value="Phone Call">📞 Phone Call</option>
                        <option value="WhatsApp">💬 WhatsApp</option>
                        <option value="Walk-in">🚶 Walk-in</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Items & Quantities *</label>
                    <textarea id="items" rows="3" required class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Delivery Time *</label>
                        <input type="datetime-local" id="deliveryDateTime" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Amount (₹) *</label>
                        <input type="number" id="totalAmount" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Notes</label>
                    <input type="text" id="notes" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                    Save Order
                </button>
            </form>
        </div>

        <!-- Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2">
            <h2 class="text-lg font-bold mb-4">Orders List</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b text-xs font-semibold text-slate-400 uppercase">
                            <th class="py-3 px-2">ID</th>
                            <th class="py-3 px-2">Customer</th>
                            <th class="py-3 px-2">Items</th>
                            <th class="py-3 px-2">Delivery Time</th>
                            <th class="py-3 px-2">Amount</th>
                            <th class="py-3 px-2">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y text-sm">
                        <tr><td colspan="6" class="text-center py-8 text-slate-400">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 🔑 PASTE YOUR SHEETDB API URL BELOW:
        const API_URL = "https://sheetdb.io/api/v1/YOUR_SHEETDB_ID";

        window.onload = function() { fetchOrders(); };

        async function fetchOrders() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderOrders(data);
            } catch (err) {
                console.error(err);
            }
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Saving...";
            btn.disabled = true;

            const newOrder = {
                "Order ID": "ORD-" + Math.floor(1000 + Math.random() * 9000),
                "Timestamp": new Date().toLocaleString(),
                "Customer Name": document.getElementById('customerName').value,
                "Phone Number": document.getElementById('phoneNumber').value,
                "Order Source": document.getElementById('orderSource').value,
                "Items & Quantities": document.getElementById('items').value,
                "Delivery Date/Time": document.getElementById('deliveryDateTime').value,
                "Total Amount": document.getElementById('totalAmount').value,
                "Status": "Pending",
                "Special Instructions": document.getElementById('notes').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: newOrder })
                });

                document.getElementById('orderForm').reset();
                alert("Order saved successfully!");
                fetchOrders();
            } catch (err) {
                alert("Error saving order.");
            }

            btn.innerText = "Save Order";
            btn.disabled = false;
        }

        function renderOrders(dataList) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';
            
            dataList.reverse().forEach(order => {
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="py-3 px-2 text-indigo-600 font-semibold">${order["Order ID"] || 'ORD'}</td>
                        <td class="py-3 px-2">${order["Customer Name"]} <br><span class="text-xs text-slate-400">${order["Phone Number"]}</span></td>
                        <td class="py-3 px-2">${order["Items & Quantities"]}</td>
                        <td class="py-3 px-2 text-xs">${order["Delivery Date/Time"]}</td>
                        <td class="py-3 px-2 font-semibold">₹${order["Total Amount"]}</td>
                        <td class="py-3 px-2"><span class="bg-amber-50 text-amber-600 px-2 py-1 rounded text-xs">${order["Status"] || 'Pending'}</span></td>
                    </tr>
                `;
            });

            if (dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">No orders found.</td></tr>`;
            }
        }
    </script>
</body>
</html>
